[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "patchwork-server"
path = "src/main.rs"

[dependencies]
actix = "0.13"
actix-web = "4"
actix-cors = "0.7"
actix-ws = "0.4"
prost = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["signal", "time", "macros"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
util_lib = { path = "../util_lib" }
game_core = { path = "../game_core" }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(not(windows))'.dependencies]
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["net", "io-util"] }
