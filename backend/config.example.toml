# Relative secret paths resolve against THIS file, not the process working directory.
listen = "127.0.0.1:8000"
jwt_secret_file = "secrets/jwt.key"
allowed_origins = ["http://localhost:8080", "http://127.0.0.1:8080", "https://ckiddo.github.io"]
workers = 2
shutdown_timeout_secs = 10
# Optional, local administrator-controlled graceful shutdown signal for deployment.
# shutdown_signal_file = "../control/backend.stop"
log_level = "info"

[auth]
allow_legacy_migration = false
websocket_auth_timeout_secs = 5

[recovery]
waiting_grace_secs = 60
game_budget_secs = 120
both_offline_retention_secs = 600
restart_grace_secs = 120

# Enable after provisioning roles and running patchwork-migrate with a separate config.
