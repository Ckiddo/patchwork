name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the public API address before publishing
        env:
          PATCHWORK_API_BASE: ${{ vars.PATCHWORK_API_BASE }}
        run: |
          python3 tools/deploy/validate_api_base.py "$PATCHWORK_API_BASE"
      - uses: actions/download-artifact@v4
        with:
          name: patchwork-pages
          path: dist
        
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
