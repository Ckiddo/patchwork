syntax = "proto3";
package patchwork.v1;

// Never reuse field numbers. Breaking changes require a new protocol version.
// IDs are opaque strings; versions/sequence numbers remain uint64 end to end.
message ClientEnvelope {
  uint32 protocol_version = 1;
  string request_id = 2;
  oneof payload {
    Authenticate authenticate = 10;
    Ping ping = 11;
    LobbyRequest lobby = 12;
    MatchRequest matchmaking = 13;
    GameRequest game = 14;
    ResumeRequest resume = 15;
    SyncAck sync_ack = 16;
  }
}

message ServerEnvelope {
  uint32 protocol_version = 1;
  // Present for a response, absent for an unsolicited push.
  optional string request_id = 2;
  uint64 event_seq = 3;
  oneof payload {
    ErrorResponse error = 10;
    Acknowledged acknowledged = 11;
    RoomSnapshot room = 12;
    MatchStatus matchmaking = 13;
    GameSnapshot game = 14;
    Pong pong = 15;
    Authenticated authenticated = 16;
    RoomList rooms = 17;
    ResumeState resumed = 18;
  }
}

message Empty {}
message Authenticate { string access_token = 1; }
message Authenticated { string user_id = 1; uint64 generation = 2; }
message Ping { uint64 nonce = 1; }
message Pong { uint64 nonce = 1; }
message Acknowledged { uint64 room_version = 1; uint64 game_version = 2; }

message LobbyRequest {
  string room_id = 1;
  uint64 expected_version = 2;
  oneof command {
    CreateRoom create = 10;
    JoinRoom join = 11;
    Empty leave = 12;
    SetReady set_ready = 13;
    Empty start = 14;
    ListRooms list = 15;
    Empty get = 16;
    SetRules set_rules = 17;
  }
}
message CreateRoom { string mode = 1; string rules_version = 2; optional string password = 3; }
message JoinRoom { string code = 1; optional string password = 2; }
message SetReady { bool ready = 1; }
message SetRules { string rules_version = 1; }
message ListRooms { string cursor = 1; uint32 limit = 2; }

message MatchRequest {
  oneof command {
    JoinQueue join = 10;
    TicketRef cancel = 11;
    TicketRef get = 12;
    TicketRef confirm = 13;
  }
}
message JoinQueue { string mode = 1; string rules_version = 2; }
message TicketRef { string ticket_id = 1; }
message MatchStatus { string ticket_id = 1; MatchPhase phase = 2; string room_id = 3; }
enum MatchPhase {
  MATCH_PHASE_UNSPECIFIED = 0;
  MATCH_PHASE_QUEUED = 1;
  MATCH_PHASE_RESERVED = 2;
  MATCH_PHASE_MATCHED = 3;
  MATCH_PHASE_CANCELLED = 4;
  MATCH_PHASE_EXPIRED = 5;
}

message GameRequest {
  string game_id = 1;
  uint64 expected_version = 2;
  oneof action {
    Empty advance = 10;
    PlacePatch buy_and_place = 11;
    BoardPosition place_special_patch = 12;
    Empty resign = 13;
  }
}
message BoardPosition { sint32 x = 1; sint32 y = 2; }
message PlacePatch {
  string patch_id = 1;
  BoardPosition position = 2;
  uint32 quarter_turns = 3;
  bool flipped = 4;
}
message ResumeRequest {
  string game_id = 1;
  uint64 last_seq = 2;
  // False after a reload without a validated local snapshot.
  bool has_snapshot = 3;
}
message SyncAck { string game_id = 1; uint64 version = 2; uint64 event_seq = 3; string sync_token = 4; }
message GameEvent { uint64 seq = 1; uint64 version = 2; bytes payload_json = 3; }
message ResumeState {
  string game_id = 1;
  uint64 version = 2;
  uint64 event_seq = 3;
  string sync_token = 4;
  GameSnapshot snapshot = 5;
  repeated GameEvent events = 6;
  string phase = 7;
}

enum RoomPhase {
  ROOM_PHASE_UNSPECIFIED = 0;
  ROOM_PHASE_WAITING = 1;
  ROOM_PHASE_STARTING = 2;
  ROOM_PHASE_PLAYING = 3;
  ROOM_PHASE_FINISHED = 4;
  ROOM_PHASE_CLOSED = 5;
}
message RoomMember {
  string user_id = 1;
  uint32 seat = 2;
  bool ready = 3;
  bool connected = 4;
  string nickname = 5;
}
message RoomSnapshot {
  string room_id = 1;
  uint64 version = 2;
  RoomPhase phase = 3;
  repeated RoomMember members = 4;
  string owner_id = 5;
  string rules_version = 6;
  string game_id = 7;
  string code = 8;
  string mode = 9;
  bool requires_password = 10;
  optional uint32 first_player_seat = 11;
}
message RoomList { repeated RoomSnapshot rooms = 1; string next_cursor = 2; }
// Core schema is versioned separately. No client command accepts a full snapshot.
message GameSnapshot {
  string game_id = 1;
  uint64 version = 2;
  uint64 event_seq = 3;
  string rules_version = 4;
  bytes state_json = 5;
  string phase = 6;
}
message ErrorResponse { ErrorCode code = 1; bool retryable = 2; }
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_MALFORMED_MESSAGE = 1;
  ERROR_CODE_UNSUPPORTED_VERSION = 2;
  ERROR_CODE_MESSAGE_TOO_LARGE = 3;
  ERROR_CODE_INVALID_REQUEST = 4;
  ERROR_CODE_UNAUTHENTICATED = 5;
  ERROR_CODE_NOT_IMPLEMENTED = 6;
  ERROR_CODE_ROOM_FULL = 7;
  ERROR_CODE_ROOM_NOT_JOINABLE = 8;
  ERROR_CODE_NOT_ENOUGH_PLAYERS = 9;
  ERROR_CODE_VERSION_CONFLICT = 10;
  ERROR_CODE_REQUEST_ID_CONFLICT = 11;
  ERROR_CODE_ALREADY_MATCHED = 12;
  ERROR_CODE_SERVICE_UNAVAILABLE = 13;
  ERROR_CODE_SERVER_RESTARTED = 14;
  ERROR_CODE_FORBIDDEN = 15;
  ERROR_CODE_NOT_FOUND = 16;
  ERROR_CODE_NOT_READY = 17;
  ERROR_CODE_PLAYER_BUSY = 18;
  ERROR_CODE_BAD_PASSWORD = 19;
  ERROR_CODE_SYNC_REQUIRED = 20;
  ERROR_CODE_RATE_LIMITED = 21;
  ERROR_CODE_GAME_NOT_RUNNING = 22;
  ERROR_CODE_NOT_YOUR_TURN = 23;
  ERROR_CODE_INVALID_PLACEMENT = 24;
  ERROR_CODE_INSUFFICIENT_BUTTONS = 25;
  ERROR_CODE_WRONG_ACTION_PHASE = 26;
}
